name: Android Play Candidate

on:
  push:
    branches: [ play-release-v1.1.0 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Lint release
        run: gradle --no-daemon lintRelease

      - name: Build unsigned release APK and AAB
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Upload Play-candidate outputs
        uses: actions/upload-artifact@v4
        with:
          name: ACC-Cleaner-v1.1.0-play-candidate-UNSIGNED
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 14
